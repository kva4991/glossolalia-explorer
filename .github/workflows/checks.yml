name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: |
          ./scripts/Sync-Documentation.ps1
          ./tests/Test-Documentation.ps1
          ./tests/Test-Project.ps1
      - name: Validate with PowerShell 7
        shell: pwsh
        run: |
          ./scripts/Sync-Documentation.ps1
          ./tests/Test-Documentation.ps1
          ./tests/Test-Project.ps1
